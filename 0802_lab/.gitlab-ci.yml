stages:
  - lfs-check
  - build
  - test-image
  - publish
  - deploy

variables:
  GIT_LFS_SKIP_SMUDGE: "0"

lfs-check:
  stage: lfs-check
  image: alpine/git:latest
  script:
    - git lfs ls-files
    - git lfs status

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .

test-image:
  stage: test-image
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker run --rm $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

publish:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker run -d --name registry-lab $CI_REGISTRY_IMAGE:latest
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual
